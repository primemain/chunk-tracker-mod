name: Find The Real API Names

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Round three lookup
        run: |
          set +e

          curl -sL -o fa.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6%2B1.21.11/fabric-api-0.141.6%2B1.21.11-fatjavadoc.jar"
          mkdir -p doc && cd doc && unzip -oq ../fa.jar
          P=net/fabricmc/fabric/api/client/rendering/v1/world

          echo "########## WorldRenderContext PLAIN TEXT ##########"
          sed -e 's/<[^>]*>/ /g' "$P/WorldRenderContext.html" 2>/dev/null | tr -s ' \n' ' \n' | grep -v '^ *$' | head -60
          echo ""

          echo "########## AbstractWorldRenderContext PLAIN TEXT ##########"
          sed -e 's/<[^>]*>/ /g' "$P/AbstractWorldRenderContext.html" 2>/dev/null | tr -s ' \n' ' \n' | grep -v '^ *$' | head -60
          echo ""

          cd ..
          Y="https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft"

          echo "########## MC RenderLayers ALL MEMBERS ##########"
          curl -sL "$Y/client/render/RenderLayers.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | sort -u | head -80
          echo ""

          echo "########## MC WorldRenderState (camera?) ##########"
          curl -sL "$Y/client/render/WorldRenderState.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | sort -u | head -40
          echo ""

          echo "########## MC VertexRendering drawOutline FULL ##########"
          curl -sL "$Y/client/render/VertexRendering.html" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' \n' | grep -A4 -i 'drawOutline' | head -30
          echo ""

          echo "########## DONE ##########"
