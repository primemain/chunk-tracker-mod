name: Find The Real API Names

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Round four lookup
        run: |
          set +e

          curl -sL -o fa.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6%2B1.21.11/fabric-api-0.141.6%2B1.21.11-fatjavadoc.jar"
          mkdir -p doc && cd doc && unzip -oq ../fa.jar
          R=net/fabricmc/fabric/api/client/rendering/v1

          echo "########## HudRenderCallback ##########"
          sed -e 's/<[^>]*>/ /g' "$R/HudRenderCallback.html" 2>/dev/null | tr -s ' \n' ' \n' | grep -v '^ *$' | sed -n '25,60p'
          echo ""

          echo "########## HudElementRegistry ##########"
          sed -e 's/<[^>]*>/ /g' "$R/HudElementRegistry.html" 2>/dev/null | tr -s ' \n' ' \n' | grep -v '^ *$' | sed -n '25,55p'
          echo ""

          echo "########## HudElement ##########"
          sed -e 's/<[^>]*>/ /g' "$R/HudElement.html" 2>/dev/null | tr -s ' \n' ' \n' | grep -v '^ *$' | sed -n '25,50p'
          echo ""

          echo "########## VanillaHudElements ##########"
          tr '<' '\n' < "$R/VanillaHudElements.html" 2>/dev/null | grep -o 'href="#[A-Z_]*"' | sed 's/href="#//; s/"//' | sort -u | head -30
          echo ""

          cd ..
          Y="https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft"

          echo "########## VertexRendering drawFilledBox ##########"
          curl -sL "$Y/client/render/VertexRendering.html" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' \n' | grep -A14 -i 'public static void drawFilledBox' | head -40
          echo ""

          echo "########## RenderLayers debug + translucent members ##########"
          curl -sL "$Y/client/render/RenderLayers.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'debug|translucent|line' | sort -u | head -40
          echo ""

          echo "########## DrawContext fill methods ##########"
          curl -sL "$Y/client/gui/DrawContext.html" | tr '<' '\n' | grep -o 'href="#fill[^"]*"' | sed 's/href="#//; s/"//' | sort -u | head -20
          echo ""

          echo "########## DONE ##########"
