name: Find The Real API Names

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Round six lookup
        run: |
          set +e

          echo "########## MOD MENU JAR ##########"
          MM="17.0.1-beta.1"
          curl -sL -o mm.jar "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/$MM/modmenu-$MM.jar"
          echo "downloaded bytes:"
          wc -c < mm.jar
          echo ""

          echo "########## API CLASSES INSIDE ##########"
          unzip -l mm.jar 2>/dev/null | grep 'api/' | awk '{print $NF}' | head -20
          echo ""

          mkdir -p mmx && cd mmx && unzip -oq ../mm.jar 2>/dev/null

          echo "########## ModMenuApi ##########"
          javap -p -classpath . com.terraformersmc.modmenu.api.ModMenuApi 2>&1 | head -20
          echo ""

          echo "########## ConfigScreenFactory ##########"
          javap -p -classpath . com.terraformersmc.modmenu.api.ConfigScreenFactory 2>&1 | head -12
          echo ""

          cd ..
          Y="https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft"

          echo "########## CyclingButtonWidget builders ##########"
          curl -sL "$Y/client/gui/widget/CyclingButtonWidget.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'builder|onoff' | sort -u | head -20
          echo ""

          echo "########## ButtonWidget builder ##########"
          curl -sL "$Y/client/gui/widget/ButtonWidget.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'builder|build|dimensions|position' | sort -u | head -20
          echo ""

          echo "########## Screen members we need ##########"
          curl -sL "$Y/client/gui/screen/Screen.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'init\(|addDrawableChild|close|render\(|title' | sort -u | head -20
          echo ""

          echo "########## Text factory methods ##########"
          curl -sL "$Y/text/Text.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'literal|translatable' | sort -u | head -10
          echo ""

          echo "########## DONE ##########"
