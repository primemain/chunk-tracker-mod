name: Build Mod
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Files
        run: |
          mkdir -p src/main/java/com/example/chunktracker
          mkdir -p src/main/resources
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = "https://fabricmc.net" }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "fabric-loom" version "1.7-SNAPSHOT"
          }
          rootProject.name = "chunktracker"
          EOF
          cat > gradle.properties << 'EOF'
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.9
          fabric_version=0.107.0+1.21.1
          mod_version=1.0.0
          maven_group=com.example.chunktracker
          archives_base_name=chunktracker
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom'
          }
          version = "1.0.0"
          group = "com.example.chunktracker"
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          java { sourceCompatibility = 21; targetCompatibility = 21 }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          EOF
          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "chunktracker",
            "version": "1.0.0",
            "name": "Chunk Tracker",
            "description": "Tracker",
            "environment": "client",
            "entrypoints": { "client": ["com.example.chunktracker.ChunkTracker"] },
            "depends": { "fabricloader": ">=0.16.9", "minecraft": "*", "java": ">=21", "fabric-api": "*" }
          }
          EOF
          cat > src/main/java/com/example/chunktracker/ChunkTintState.java << 'EOF'
          package com.example.chunktracker;
          import java.util.HashSet;
          import java.util.Set;
          import net.minecraft.util.math.ChunkPos;
          public class ChunkTintState {
              private static final Set<ChunkPos> marked = new HashSet<>();
              public static void mark(ChunkPos center) {
                  for (int dx = -1; dx <= 1; dx++) {
                      for (int dz = -1; dz <= 1; dz++) {
                          marked.add(new ChunkPos(center.x + dx, center.z + dz));
                      }
                  }
              }
              public static Set<ChunkPos> getMarked() { return marked; }
          }
          EOF
          cat > src/main/java/com/example/chunktracker/ChunkTracker.java << 'EOF'
          package com.example.chunktracker;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;
          public class ChunkTracker implements ClientModInitializer {
              private static KeyBinding key;
              @Override
              public void onInitializeClient() {
                  key = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.tracker.mark", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_G, "key.categories.tracker"));
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (key.wasPressed() && client.player != null) {
                          ChunkTintState.mark(client.player.getChunkPos());
                      }
                  });
                  WorldRenderEvents.END.register(ChunkOverlayRenderer::render);
              }
          }
          EOF
          cat > src/main/java/com/example/chunktracker/ChunkOverlayRenderer.java << 'EOF'
          package com.example.chunktracker;
          import com.mojang.blaze3d.systems.RenderSystem;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext;
          import net.minecraft.client.render.*;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.util.math.ChunkPos;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;
          import org.joml.Matrix4f;
          public class ChunkOverlayRenderer {
              public static void render(WorldRenderContext ctx) {
                  if (ChunkTintState.getMarked().isEmpty()) return;
                  World world = ctx.world();
                  MatrixStack stack = ctx.matrixStack();
                  if (world == null || stack == null) return;
                  Vec3d cam = ctx.camera().getPos();
                  int bY = world.getBottomY(), tY = bY + world.getHeight();
                  RenderSystem.enableBlend();
                  RenderSystem.defaultBlendFunc();
                  RenderSystem.setShader(GameRenderer::getPositionColorProgram);
                  RenderSystem.lineWidth(3.0f);
                  RenderSystem.disableDepthTest();
                  Tessellator ts = Tessellator.getInstance();
                  BufferBuilder buf = ts.begin(VertexFormat.DrawMode.LINES, VertexFormats.POSITION_COLOR);
                  stack.push();
                  Matrix4f mat = stack.peek().getPositionMatrix();
                  float r=1f, g=0f, b=0f, a=1f;
                  for (ChunkPos pos : ChunkTintState.getMarked()) {
                      double x0 = pos.getStartX() - cam.x, z0 = pos.getStartZ() - cam.z;
                      double x1 = pos.getEndX() + 1 - cam.x, z1 = pos.getEndZ() + 1 - cam.z;
                      buf.vertex(mat, (float)x0, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, bY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, bY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z0).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x1, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z1).color(r, g, b, a);
                      buf.vertex(mat, (float)x0, tY, (float)z0).color(r, g, b, a);
                  }
                  BufferRenderer.drawWithGlobalProgram(buf.end());
                  stack.pop();
                  RenderSystem.enableDepthTest();
                  RenderSystem.disableBlend();
              }
          }
          EOF
      - name: Wrapper
        run: |
          npm install -g corepack
          gradle wrapper --gradle-version 8.10
          chmod +x gradlew
      - name: Build
        run: ./gradlew build
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: build/libs/*.jar
