name: Find The Real API Names

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Round five lookup
        run: |
          set +e
          Y="https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft"

          echo "########## Heightmap TYPES ##########"
          curl -sL "$Y/world/Heightmap.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | sort -u | head -30
          echo ""

          echo "########## Heightmap.Type CONSTANTS ##########"
          curl -sL "$Y/world/Heightmap.Type.html" | tr '<' '\n' | grep -o 'href="#[A-Z_]*"' | sed 's/href="#//; s/"//' | sort -u | head -20
          echo ""

          echo "########## World getTopY / height methods ##########"
          curl -sL "$Y/world/World.html" | tr '<' '\n' | grep -o 'href="#get[A-Za-z]*([^"]*)"' | sed 's/href="#//; s/"//' | grep -iE 'topy|height|bottom|chunk' | sort -u | head -20
          echo ""

          echo "########## BlockState getMapColor ##########"
          curl -sL "$Y/block/BlockState.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'mapcolor|color' | sort -u | head -20
          echo ""

          echo "########## MapColor members ##########"
          curl -sL "$Y/block/MapColor.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -viE '^[A-Z_]+$' | sort -u | head -30
          echo ""

          echo "########## MapColor Brightness ##########"
          curl -sL "$Y/block/MapColor.Brightness.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | sort -u | head -20
          echo ""

          echo "########## ClientWorld chunk access ##########"
          curl -sL "$Y/client/world/ClientWorld.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'chunk|loaded' | sort -u | head -20
          echo ""

          echo "########## Window scale methods ##########"
          curl -sL "$Y/client/util/Window.html" | tr '<' '\n' | grep -o 'href="#[^"]*"' | sed 's/href="#//; s/"//' | grep -iE 'scale|width|height' | sort -u | head -20
          echo ""

          echo "########## DONE ##########"
