name: Build Chunk Tracker Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create all the mod files
        run: |
          mkdir -p src/main/java/com/example/chunktracker
          mkdir -p src/main/resources/assets/chunktracker/lang

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = uri("https://maven.fabricmc.net/") }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.3
          loader_version=0.18.1
          fabric_version=0.141.6+1.21.11
          modmenu_version=17.0.1-beta.1
          mod_version=5.1.0
          maven_group=com.example.chunktracker
          archives_base_name=chunktracker
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven { url = uri("https://maven.terraformersmc.com/releases") }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }
          EOF

          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "chunktracker",
            "version": "${version}",
            "name": "Chunk Tracker",
            "description": "Automatically marks the chunks you have walked through, with a red border wall, a screen tint, and its own terrain minimap.",
            "environment": "client",
            "license": "CC0-1.0",
            "entrypoints": {
              "client": [
                "com.example.chunktracker.ChunkTracker"
              ],
              "modmenu": [
                "com.example.chunktracker.ModMenuIntegration"
              ]
            },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/assets/chunktracker/lang/en_us.json << 'EOF'
          {
            "key.chunktracker.minimap": "Toggle Chunk Minimap"
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ModConfig.java << 'EOF'
          package com.example.chunktracker;

          // Everything the Mod Menu settings screen controls.
          //
          // The three switches are separate on purpose. Turning the world
          // marks off leaves the game looking completely normal while the
          // minimap still shows you exactly where you have been.
          //
          // None of these stop chunks being recorded. The list keeps filling
          // up no matter what.
          public class ModConfig {

              // Zoom steps, in blocks per map pixel. All divide evenly into a
              // 16 block chunk, which keeps the grid lines honest.
              private static final int[] ZOOM_STEPS = { 1, 2, 4, 8, 16 };

              // Minimap sizes, in real screen pixels.
              private static final int[] SIZE_STEPS = { 280, 420, 560, 700, 840 };

              private static boolean worldMarksOn = true;
              private static boolean minimapOn = true;
              private static boolean minimapMarksOn = true;

              private static int blocksPerDot = 4;
              private static int mapSizeReal = 560;

              public static boolean isWorldMarksOn() {
                  return worldMarksOn;
              }

              public static boolean isMinimapOn() {
                  return minimapOn;
              }

              public static boolean isMinimapMarksOn() {
                  return minimapMarksOn;
              }

              public static int getBlocksPerDot() {
                  return blocksPerDot;
              }

              public static int getMapSizeReal() {
                  return mapSizeReal;
              }

              public static void setWorldMarksOn(boolean value) {
                  worldMarksOn = value;
              }

              public static void setMinimapOn(boolean value) {
                  minimapOn = value;
              }

              public static void setMinimapMarksOn(boolean value) {
                  minimapMarksOn = value;
              }

              public static void cycleZoom() {
                  blocksPerDot = nextIn(ZOOM_STEPS, blocksPerDot);
              }

              public static void cycleSize() {
                  mapSizeReal = nextIn(SIZE_STEPS, mapSizeReal);
              }

              private static int nextIn(int[] steps, int current) {
                  for (int i = 0; i < steps.length; i++) {
                      if (steps[i] == current) {
                          return steps[(i + 1) % steps.length];
                      }
                  }
                  return steps[0];
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ModMenuIntegration.java << 'EOF'
          package com.example.chunktracker;

          import com.terraformersmc.modmenu.api.ConfigScreenFactory;
          import com.terraformersmc.modmenu.api.ModMenuApi;

          // Tells Mod Menu this mod has a settings screen, so the cog button
          // shows up next to it in the mod list.
          public class ModMenuIntegration implements ModMenuApi {

              @Override
              public ConfigScreenFactory<?> getModConfigScreenFactory() {
                  return ConfigScreen::new;
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ConfigScreen.java << 'EOF'
          package com.example.chunktracker;

          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          // The settings screen: three switches, two cycling values, and done.
          public class ConfigScreen extends Screen {

              private final Screen parent;

              public ConfigScreen(Screen parent) {
                  super(Text.literal("Chunk Tracker"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int buttonWidth = 260;
                  int left = this.width / 2 - buttonWidth / 2;
                  int y = this.height / 6;
                  int gap = 24;

                  this.addDrawableChild(ButtonWidget.builder(worldLabel(), button -> {
                      ModConfig.setWorldMarksOn(!ModConfig.isWorldMarksOn());
                      button.setMessage(worldLabel());
                  }).dimensions(left, y, buttonWidth, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(minimapMarksLabel(), button -> {
                      ModConfig.setMinimapMarksOn(!ModConfig.isMinimapMarksOn());
                      button.setMessage(minimapMarksLabel());
                  }).dimensions(left, y + gap, buttonWidth, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(minimapLabel(), button -> {
                      ModConfig.setMinimapOn(!ModConfig.isMinimapOn());
                      button.setMessage(minimapLabel());
                  }).dimensions(left, y + gap * 2, buttonWidth, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(zoomLabel(), button -> {
                      ModConfig.cycleZoom();
                      button.setMessage(zoomLabel());
                  }).dimensions(left, y + gap * 3 + 10, buttonWidth, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(sizeLabel(), button -> {
                      ModConfig.cycleSize();
                      button.setMessage(sizeLabel());
                  }).dimensions(left, y + gap * 4 + 10, buttonWidth, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(
                          Text.literal("Done"), button -> this.close()
                  ).dimensions(left, y + gap * 5 + 30, buttonWidth, 20).build());
              }

              private static Text worldLabel() {
                  return Text.literal("Red marks in the world: "
                          + (ModConfig.isWorldMarksOn() ? "ON" : "OFF"));
              }

              private static Text minimapMarksLabel() {
                  return Text.literal("Red marks on the minimap: "
                          + (ModConfig.isMinimapMarksOn() ? "ON" : "OFF"));
              }

              private static Text minimapLabel() {
                  return Text.literal("Show minimap: "
                          + (ModConfig.isMinimapOn() ? "ON" : "OFF"));
              }

              private static Text zoomLabel() {
                  int blocks = ModConfig.getBlocksPerDot();
                  return Text.literal("Zoom: " + blocks
                          + (blocks == 1 ? " block per pixel" : " blocks per pixel")
                          + "  (higher = see further)");
              }

              private static Text sizeLabel() {
                  return Text.literal("Minimap size: " + ModConfig.getMapSizeReal());
              }

              @Override
              public void close() {
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ChunkTintState.java << 'EOF'
          package com.example.chunktracker;

          import java.util.HashSet;
          import java.util.Set;
          import net.minecraft.util.math.ChunkPos;

          // The list of every chunk you have walked through.
          //
          // Nothing is ever removed, and it keeps filling up even while every
          // switch is off.
          //
          // Lives only in memory on your own client. Nothing is saved to the
          // world, nothing is sent to the server, nothing touches real blocks.
          public class ChunkTintState {
              private static final Set<ChunkPos> markedChunks = new HashSet<>();

              public static void markChunksAroundPlayer(ChunkPos center) {
                  for (int dx = -1; dx <= 1; dx++) {
                      for (int dz = -1; dz <= 1; dz++) {
                          markedChunks.add(new ChunkPos(center.x + dx, center.z + dz));
                      }
                  }
              }

              public static boolean isMarked(int chunkX, int chunkZ) {
                  return markedChunks.contains(new ChunkPos(chunkX, chunkZ));
              }

              public static Set<ChunkPos> getMarkedChunks() {
                  return markedChunks;
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ChunkTracker.java << 'EOF'
          package com.example.chunktracker;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          // Marking happens by itself as you walk, always, whatever the
          // switches say. O is a quick shortcut for the minimap switch.
          public class ChunkTracker implements ClientModInitializer {

              private static KeyBinding minimapKey;

              @Override
              public void onInitializeClient() {
                  minimapKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.chunktracker.minimap",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_O,
                          KeyBinding.Category.MISC
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player != null) {
                          ChunkTintState.markChunksAroundPlayer(client.player.getChunkPos());
                      }
                      while (minimapKey.wasPressed()) {
                          ModConfig.setMinimapOn(!ModConfig.isMinimapOn());
                      }
                      MinimapRenderer.tick();
                  });

                  WorldRenderEvents.AFTER_ENTITIES.register(ChunkOverlayRenderer::render);
                  ScreenTintRenderer.register();
                  MinimapRenderer.register();
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ChunkOverlayRenderer.java << 'EOF'
          package com.example.chunktracker;

          import java.util.Set;
          import net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.RenderLayers;
          import net.minecraft.client.render.VertexConsumer;
          import net.minecraft.client.render.VertexConsumerProvider;
          import net.minecraft.client.render.VertexRendering;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.util.math.ChunkPos;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.util.shape.VoxelShape;
          import net.minecraft.util.shape.VoxelShapes;

          // Red outline for every nearby marked chunk, plus a see-through red
          // wall around the outside edge of the marked area.
          public class ChunkOverlayRenderer {

              // Only chunks this close get drawn. Chunks further away are
              // STILL MARKED and still show on the minimap - drawing boxes
              // you cannot see is what was costing the frame rate.
              private static final int DRAW_DISTANCE_CHUNKS = 12;

              private static final int OUTLINE_RED = 0xFFFF0000;

              private static final float WALL_R = 1.0F;
              private static final float WALL_G = 0.0F;
              private static final float WALL_B = 0.0F;
              private static final float WALL_A = 0.22F;

              public static void render(WorldRenderContext context) {
                  if (!ModConfig.isWorldMarksOn()) return;

                  Set<ChunkPos> marked = ChunkTintState.getMarkedChunks();
                  if (marked.isEmpty()) return;

                  MinecraftClient client = MinecraftClient.getInstance();
                  ClientWorld world = client.world;
                  if (world == null || client.player == null) return;

                  MatrixStack matrices = context.matrices();
                  VertexConsumerProvider consumers = context.consumers();
                  if (matrices == null || consumers == null) return;

                  Vec3d camera = client.gameRenderer.getCamera().getCameraPos();
                  double cx = camera.x;
                  double cy = camera.y;
                  double cz = camera.z;

                  int playerChunkX = client.player.getChunkPos().x;
                  int playerChunkZ = client.player.getChunkPos().z;

                  double bottomY = world.getBottomY();
                  double topY = bottomY + world.getHeight();

                  VertexConsumer lines = consumers.getBuffer(RenderLayers.LINES);
                  for (ChunkPos pos : marked) {
                      if (tooFar(pos, playerChunkX, playerChunkZ)) continue;

                      VoxelShape box = VoxelShapes.cuboidUnchecked(
                              pos.getStartX(), bottomY, pos.getStartZ(),
                              pos.getEndX() + 1, topY, pos.getEndZ() + 1
                      );
                      VertexRendering.drawOutline(
                              matrices, lines, box,
                              -cx, -cy, -cz,
                              OUTLINE_RED, 1.0F
                      );
                  }

                  VertexConsumer walls = consumers.getBuffer(RenderLayers.debugQuads());
                  MatrixStack.Entry entry = matrices.peek();
                  double wallBottom = bottomY - cy;
                  double wallTop = topY - cy;

                  for (ChunkPos pos : marked) {
                      if (tooFar(pos, playerChunkX, playerChunkZ)) continue;

                      double minX = pos.getStartX() - cx;
                      double minZ = pos.getStartZ() - cz;
                      double maxX = pos.getEndX() + 1 - cx;
                      double maxZ = pos.getEndZ() + 1 - cz;

                      if (!ChunkTintState.isMarked(pos.x, pos.z - 1)) {
                          wall(entry, walls, minX, minZ, maxX, minZ, wallBottom, wallTop);
                      }
                      if (!ChunkTintState.isMarked(pos.x, pos.z + 1)) {
                          wall(entry, walls, minX, maxZ, maxX, maxZ, wallBottom, wallTop);
                      }
                      if (!ChunkTintState.isMarked(pos.x - 1, pos.z)) {
                          wall(entry, walls, minX, minZ, minX, maxZ, wallBottom, wallTop);
                      }
                      if (!ChunkTintState.isMarked(pos.x + 1, pos.z)) {
                          wall(entry, walls, maxX, minZ, maxX, maxZ, wallBottom, wallTop);
                      }
                  }
              }

              private static boolean tooFar(ChunkPos pos, int playerChunkX, int playerChunkZ) {
                  return Math.abs(pos.x - playerChunkX) > DRAW_DISTANCE_CHUNKS
                      || Math.abs(pos.z - playerChunkZ) > DRAW_DISTANCE_CHUNKS;
              }

              private static void wall(MatrixStack.Entry entry, VertexConsumer buffer,
                                       double x1, double z1, double x2, double z2,
                                       double yBottom, double yTop) {
                  vertex(entry, buffer, x1, yBottom, z1);
                  vertex(entry, buffer, x2, yBottom, z2);
                  vertex(entry, buffer, x2, yTop, z2);
                  vertex(entry, buffer, x1, yTop, z1);

                  vertex(entry, buffer, x1, yTop, z1);
                  vertex(entry, buffer, x2, yTop, z2);
                  vertex(entry, buffer, x2, yBottom, z2);
                  vertex(entry, buffer, x1, yBottom, z1);
              }

              private static void vertex(MatrixStack.Entry entry, VertexConsumer buffer,
                                         double x, double y, double z) {
                  buffer.vertex(entry, (float) x, (float) y, (float) z)
                        .color(WALL_R, WALL_G, WALL_B, WALL_A);
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/ScreenTintRenderer.java << 'EOF'
          package com.example.chunktracker;

          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.MinecraftClient;

          // Light red wash over the screen while you stand inside an area you
          // have already marked. Tied to the world switch, so turning that off
          // leaves the game looking completely untouched.
          public class ScreenTintRenderer {

              private static final int TINT = 0x22FF0000;

              public static void register() {
                  HudRenderCallback.EVENT.register((drawContext, tickCounter) -> {
                      if (!ModConfig.isWorldMarksOn()) return;

                      MinecraftClient client = MinecraftClient.getInstance();
                      if (client.player == null) return;

                      int chunkX = client.player.getChunkPos().x;
                      int chunkZ = client.player.getChunkPos().z;
                      if (!ChunkTintState.isMarked(chunkX, chunkZ)) return;

                      int width = client.getWindow().getScaledWidth();
                      int height = client.getWindow().getScaledHeight();
                      drawContext.fill(0, 0, width, height, TINT);
                  });
              }
          }
          EOF

          cat > src/main/java/com/example/chunktracker/MinimapRenderer.java << 'EOF'
          package com.example.chunktracker;

          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.MapColor;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.world.Heightmap;

          // A terrain minimap in the top left corner.
          //
          // The map is locked to a fixed grid in the world, so terrain, red
          // marks and chunk lines can never drift apart from each other.
          //
          // Each map dot is drawn as small as the screen allows, so the map is
          // as detailed as it can be for the zoom you pick. One block per
          // pixel is the hard ceiling - below that there is nothing more to
          // show, because a block is the smallest thing the ground has.
          public class MinimapRenderer {

              // How far from the corner, in real pixels.
              private static final int MARGIN_REAL = 16;

              // Ceiling on dots across the map. Every dot has to be read out
              // of the world, so this stops a huge map on a low GUI scale
              // from causing a stutter when the picture is rebuilt.
              private static final int MAX_DOTS = 192;

              // How often the picture refreshes to pick up changed blocks.
              // Moving or changing a setting refreshes it straight away.
              private static final int REFRESH_TICKS = 20;

              private static final int UNLOADED      = 0xFF15151A;
              private static final int FRAME_OUTER   = 0xFF000000;
              private static final int FRAME_SHADOW  = 0xFF4A4A56;
              private static final int FRAME_LIGHT   = 0xFFC6C6D2;
              private static final int FRAME_INNER   = 0xFF1B1B23;
              private static final int PLAYER_DOT    = 0xFFFFFFFF;
              private static final int PLAYER_EDGE   = 0xFF000000;
              private static final int NORTH_MARK    = 0xFFE03A3A;
              private static final int CHUNK_LINE    = 0x33000000;

              private static final double RED_STRENGTH = 0.5;

              private static int tickCounter = 0;

              private static int[] cache = null;
              private static int cacheDots = 0;
              private static int cacheOriginX = Integer.MIN_VALUE;
              private static int cacheOriginZ = Integer.MIN_VALUE;
              private static int cacheBlocksPerDot = 0;
              private static boolean cacheMarksShown = true;

              public static void tick() {
                  tickCounter++;
                  if (tickCounter >= REFRESH_TICKS) {
                      tickCounter = 0;
                      cache = null;
                  }
              }

              public static void register() {
                  HudRenderCallback.EVENT.register((drawContext, delta) -> {
                      if (!ModConfig.isMinimapOn()) return;

                      MinecraftClient client = MinecraftClient.getInstance();
                      if (client.player == null || client.world == null) return;
                      if (client.options.hudHidden) return;

                      int blocksPerDot = ModConfig.getBlocksPerDot();

                      // The size setting is in real pixels, but drawing happens
                      // in GUI pixels, which are bigger. Divide it down.
                      int scale = Math.max(1, (int) client.getWindow().getScaleFactor());
                      int mapSizeGui = Math.max(48, ModConfig.getMapSizeReal() / scale);
                      int margin = Math.max(2, MARGIN_REAL / scale);

                      // One screen pixel per dot is the sharpest possible.
                      // Only grow the dots if the map would otherwise need
                      // more samples than the ceiling allows.
                      int dotSize = Math.max(1, (mapSizeGui + MAX_DOTS - 1) / MAX_DOTS);
                      int dots = Math.max(17, mapSizeGui / dotSize);
                      if (dots % 2 == 0) dots++;
                      int drawnSize = dots * dotSize;
                      int half = dots / 2;

                      int playerX = (int) Math.floor(client.player.getX());
                      int playerZ = (int) Math.floor(client.player.getZ());

                      // Snap to the fixed world grid, so the map only shifts
                      // when you cross into the next square.
                      int playerDotX = Math.floorDiv(playerX, blocksPerDot);
                      int playerDotZ = Math.floorDiv(playerZ, blocksPerDot);
                      int originX = (playerDotX - half) * blocksPerDot;
                      int originZ = (playerDotZ - half) * blocksPerDot;

                      boolean marksShown = ModConfig.isMinimapMarksOn();

                      if (cache == null || cacheDots != dots
                              || cacheOriginX != originX || cacheOriginZ != originZ
                              || cacheBlocksPerDot != blocksPerDot
                              || cacheMarksShown != marksShown) {
                          rebuild(client.world, dots, originX, originZ, blocksPerDot, marksShown);
                      }

                      int left = margin + 4;
                      int top = margin + 4;
                      int right = left + drawnSize;
                      int bottom = top + drawnSize;

                      // Bevelled frame: black edge, dark shadow, light rim,
                      // then a dark inner line so the map reads as inset.
                      drawContext.fill(left - 4, top - 4, right + 4, bottom + 4, FRAME_OUTER);
                      drawContext.fill(left - 3, top - 3, right + 3, bottom + 3, FRAME_SHADOW);
                      drawContext.fill(left - 2, top - 2, right + 2, bottom + 2, FRAME_LIGHT);
                      drawContext.fill(left - 1, top - 1, right + 1, bottom + 1, FRAME_INNER);

                      // Draw stretches of the same colour in one go rather
                      // than one draw per dot.
                      for (int dy = 0; dy < dots; dy++) {
                          int runStart = 0;
                          int runColour = cache[dy * dots];

                          for (int dx = 1; dx <= dots; dx++) {
                              int here = (dx < dots) ? cache[dy * dots + dx] : ~runColour;

                              if (here != runColour) {
                                  drawContext.fill(
                                          left + runStart * dotSize, top + dy * dotSize,
                                          left + dx * dotSize, top + dy * dotSize + dotSize,
                                          runColour);
                                  runStart = dx;
                                  runColour = here;
                              }
                          }
                      }

                      // Chunk lines, from the SAME origin as the terrain.
                      // Skipped when a chunk is too few pixels wide to read,
                      // otherwise the grid turns into a solid smear.
                      int chunkPixels = (16 / blocksPerDot) * dotSize;
                      if (chunkPixels >= 4) {
                          for (int dx = 0; dx < dots; dx++) {
                              if (Math.floorMod(originX + dx * blocksPerDot, 16) == 0) {
                                  int x = left + dx * dotSize;
                                  drawContext.fill(x, top, x + 1, bottom, CHUNK_LINE);
                              }
                          }
                          for (int dy = 0; dy < dots; dy++) {
                              if (Math.floorMod(originZ + dy * blocksPerDot, 16) == 0) {
                                  int y = top + dy * dotSize;
                                  drawContext.fill(left, y, right, y + 1, CHUNK_LINE);
                              }
                          }
                      }

                      // Small red tick on the top edge, so north is obvious.
                      int centreX = left + drawnSize / 2;
                      drawContext.fill(centreX - 1, top, centreX + 2, top + 5, NORTH_MARK);

                      drawPlayer(drawContext, client, left, top, half, dotSize);
                  });
              }

              // You, plus a short line showing which way you are looking.
              private static void drawPlayer(net.minecraft.client.gui.DrawContext drawContext,
                                             MinecraftClient client,
                                             int left, int top, int half, int dotSize) {
                  int midX = left + half * dotSize + dotSize / 2;
                  int midY = top + half * dotSize + dotSize / 2;

                  double yaw = Math.toRadians(client.player.getYaw());
                  double faceX = -Math.sin(yaw);
                  double faceY = Math.cos(yaw);

                  for (int step = 3; step <= 8; step++) {
                      int x = midX + (int) Math.round(faceX * step);
                      int y = midY + (int) Math.round(faceY * step);
                      drawContext.fill(x - 1, y - 1, x + 2, y + 2, PLAYER_EDGE);
                  }
                  for (int step = 3; step <= 8; step++) {
                      int x = midX + (int) Math.round(faceX * step);
                      int y = midY + (int) Math.round(faceY * step);
                      drawContext.fill(x, y, x + 1, y + 1, PLAYER_DOT);
                  }

                  drawContext.fill(midX - 3, midY - 3, midX + 4, midY + 4, PLAYER_EDGE);
                  drawContext.fill(midX - 2, midY - 2, midX + 3, midY + 3, PLAYER_DOT);
              }

              // Walks the ground around you and works out a colour per dot.
              private static void rebuild(ClientWorld world, int dots,
                                          int originX, int originZ,
                                          int blocksPerDot, boolean marksShown) {
                  int[] colours = new int[dots * dots];
                  BlockPos.Mutable pos = new BlockPos.Mutable();

                  for (int dy = 0; dy < dots; dy++) {
                      for (int dx = 0; dx < dots; dx++) {
                          int worldX = originX + dx * blocksPerDot;
                          int worldZ = originZ + dy * blocksPerDot;

                          if (!world.isChunkLoaded(worldX >> 4, worldZ >> 4)) {
                              colours[dy * dots + dx] = UNLOADED;
                              continue;
                          }

                          int surfaceY = world.getTopY(Heightmap.Type.WORLD_SURFACE, worldX, worldZ);
                          pos.set(worldX, surfaceY - 1, worldZ);
                          BlockState state = world.getBlockState(pos);
                          MapColor mapColour = state.getMapColor(world, pos);

                          int rgb;
                          if (mapColour == null) {
                              rgb = UNLOADED;
                          } else {
                              MapColor.Brightness shade =
                                      shadeFor(world, worldX, worldZ, surfaceY, blocksPerDot);
                              rgb = 0xFF000000 | (mapColour.getRenderColor(shade) & 0x00FFFFFF);
                          }

                          if (marksShown && ChunkTintState.isMarked(worldX >> 4, worldZ >> 4)) {
                              rgb = washRed(rgb);
                          }

                          colours[dy * dots + dx] = rgb;
                      }
                  }

                  cache = colours;
                  cacheDots = dots;
                  cacheOriginX = originX;
                  cacheOriginZ = originZ;
                  cacheBlocksPerDot = blocksPerDot;
                  cacheMarksShown = marksShown;
              }

              // Deep water darkens with depth, land shades by slope.
              private static MapColor.Brightness shadeFor(ClientWorld world, int worldX,
                                                          int worldZ, int surfaceY,
                                                          int blocksPerDot) {
                  int floorY = world.getTopY(Heightmap.Type.OCEAN_FLOOR, worldX, worldZ);
                  int depth = surfaceY - floorY;

                  if (depth >= 2) {
                      if (depth > 9) return MapColor.Brightness.LOWEST;
                      if (depth > 4) return MapColor.Brightness.LOW;
                      return MapColor.Brightness.NORMAL;
                  }

                  int northY = world.getTopY(Heightmap.Type.WORLD_SURFACE,
                          worldX, worldZ - blocksPerDot);
                  int rise = surfaceY - northY;

                  if (rise > 2) return MapColor.Brightness.HIGH;
                  if (rise < -2) return MapColor.Brightness.LOWEST;
                  if (rise < 0) return MapColor.Brightness.LOW;
                  return MapColor.Brightness.NORMAL;
              }

              // Mixes red in without hiding the ground underneath.
              private static int washRed(int argb) {
                  int r = (argb >> 16) & 0xFF;
                  int g = (argb >> 8) & 0xFF;
                  int b = argb & 0xFF;

                  r = (int) (r * (1 - RED_STRENGTH) + 255 * RED_STRENGTH);
                  g = (int) (g * (1 - RED_STRENGTH));
                  b = (int) (b * (1 - RED_STRENGTH));

                  return 0xFF000000 | (Math.min(255, r) << 16) | (g << 8) | b;
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Make the Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1
          chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Upload the finished mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunktracker-mod
          path: build/libs/*.jar
