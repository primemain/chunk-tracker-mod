name: Find The Real API Names

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Look up the real class and method names
        run: |
          set +e

          echo "########## 1. FABRIC API RENDERING CLASSES ##########"
          curl -sL -o fa.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6%2B1.21.11/fabric-api-0.141.6%2B1.21.11-fatjavadoc.jar"
          echo "downloaded bytes:"
          wc -c < fa.jar
          unzip -l fa.jar 2>/dev/null | grep "client/rendering" | awk '{print $NF}' | sed 's|.*/||' | grep '\.html$' | sort -u
          echo ""

          echo "########## 2. ANY CLASS WITH 'World' AND 'Render' ##########"
          unzip -l fa.jar 2>/dev/null | awk '{print $NF}' | grep -i 'worldrender' | sort -u
          echo ""

          echo "########## 3. VertexRendering METHODS ##########"
          curl -sL "https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft/client/render/VertexRendering.html" \
            | tr '<' '\n' | grep -i 'drawbox\|drawfilledbox\|drawoutline' | head -40
          echo ""

          echo "########## 4. RenderLayer LINE METHODS ##########"
          curl -sL "https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft/client/render/RenderLayer.html" \
            | tr '<' '\n' | grep -i 'line' | grep -i 'get\|static' | head -40
          echo ""

          echo "########## 5. KeyBinding.Category FIELDS ##########"
          curl -sL "https://maven.fabricmc.net/docs/yarn-1.21.11%2Bbuild.3/net/minecraft/client/option/KeyBinding.Category.html" \
            | tr '<' '\n' | grep -E 'MISC|GAMEPLAY|MOVEMENT|create|register' | head -30
          echo ""

          echo "########## DONE ##########"
